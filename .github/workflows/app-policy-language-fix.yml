name: Karaji Policy Language Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[policy-fix]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply requested fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) Legal/App Policy page: language must follow the app language only.
          legal = Path('public/legal/index.html')
          s = legal.read_text(encoding='utf-8')

          s = re.sub(r'<div class="langs">.*?</div>', '', s, count=1, flags=re.S)
          s = re.sub(r"const p=new URLSearchParams\(location\.search\);let lang=p\.get\('lang'\);\nif\(!lang\)\{.*?\}\nif\(!lang\)lang='ar';", """let lang='en';
          try{const saved=localStorage.getItem('karajy-language');if(saved==='ar'||saved==='en')lang=saved;}catch(e){}""", s, count=1, flags=re.S)

          s = re.sub(r"function apply\(next\)\{.*?\}\napply\(lang\);", """function apply(next){lang=next;const isAr=next==='ar';document.documentElement.lang=next;document.documentElement.dir=isAr?'rtl':'ltr';document.getElementById('arContent').classList.toggle('hidden',!isAr);document.getElementById('enContent').classList.toggle('hidden',isAr);document.getElementById('navAr').classList.toggle('hidden',!isAr);document.getElementById('navEn').classList.toggle('hidden',isAr);const t=isAr?ar:en;document.getElementById('backText').textContent=t.back;document.getElementById('brand').textContent=t.brand;document.getElementById('subtitle').textContent=t.subtitle;document.getElementById('notice').textContent=t.notice;document.getElementById('backBtn').href='/';}
          apply(lang);""", s, count=1, flags=re.S)
          s = s.replace("document.getElementById('arBtn').onclick=()=>apply('ar');document.getElementById('enBtn').onclick=()=>apply('en');apply(lang);", "apply(lang);")
          legal.write_text(s, encoding='utf-8')

          # 2) Free garage page: initialize from the app's selected language.
          garage = Path('public/free-garage/index.html')
          g = garage.read_text(encoding='utf-8')
          g = g.replace('let lang="en";', "let lang=(()=>{try{const saved=localStorage.getItem('karajy-language');if(saved==='ar'||saved==='en')return saved;}catch(e){}return 'en';})();")
          garage.write_text(g, encoding='utf-8')

          # 3) Remove only the General / Not Sure category from the fault-category list.
          app = Path('src/App.jsx')
          a = app.read_text(encoding='utf-8')
          a, removed = re.subn(r"\n\s*\{\n\s*id: \"general\",.*?\n\s*\},\n\s*\];", "\n];", a, count=1, flags=re.S)
          if removed != 1:
              raise SystemExit('Could not safely remove the General category from CATEGORIES')

          # 4) Rename only the legal menu labels requested by the user.
          a = a.replace('الشؤون القانونية', 'سياسة الموقع')
          a = re.sub(r'(?<![A-Za-z])Legal(?![A-Za-z])', 'App policy', a)
          app.write_text(a, encoding='utf-8')

          print('Requested Karaji fixes applied.')
          print('Legal Arabic label count:', a.count('سياسة الموقع'))
          print('App policy label count:', a.count('App policy'))

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/legal/index.html public/free-garage/index.html src/App.jsx
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Fix app policy language and fault menu [policy-fix]"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/app-policy-language-fix.yml
          git commit -m "Remove temporary policy fix workflow [policy-fix]"
          git push
