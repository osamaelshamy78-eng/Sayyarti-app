<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Karaji — Add Your Garage Free</title>
  <style>
    :root{--asphalt:#14171C;--panel:#1D2129;--line:#2A2F38;--cream:#F2ECDD;--dim:#B9B2A0;--amber:#F5B942;--red:#E4432B;--blue:#4C7EA8}
    *{box-sizing:border-box} body{margin:0;background:#0A0B0D;color:var(--cream);font-family:Inter,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:22px 14px}
    .app{width:min(430px,100%);background:var(--asphalt);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.45)}
    header{display:flex;align-items:center;justify-content:space-between;padding:18px;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}.logo{width:34px;height:34px;border-radius:50%;background:var(--amber);color:var(--asphalt);display:grid;place-items:center}
    .langs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}.langs button{border:0;background:transparent;color:var(--dim);padding:6px 10px;border-radius:999px;cursor:pointer;font-weight:700}.langs .active{background:var(--amber);color:var(--asphalt)}
    main{padding:20px 18px 24px} h1{font-size:22px;margin:0 0 7px} p{color:var(--dim);font-size:13px;line-height:1.65;margin:0 0 16px}
    label{display:block;color:var(--dim);font-size:11.5px;margin:0 0 6px} input,select{width:100%;background:#101319;border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--cream);font-size:13px;margin:0 0 11px;outline:none} input:focus,select:focus{border-color:var(--amber)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{width:100%;border:0;border-radius:10px;padding:12px;font-weight:800;cursor:pointer}.primary{background:var(--amber);color:var(--asphalt)}.secondary{background:transparent;color:var(--blue);border:1px solid #4C7EA888}.secondary,.back{margin-bottom:11px}.msg{padding:11px 12px;border-radius:10px;font-size:12px;line-height:1.6;margin-bottom:11px}.error{background:#E4432B18;border:1px solid #E4432B66;color:#F28B7D}.success{background:#F5B94218;border:1px solid #F5B94266;color:var(--cream)}.free{display:inline-block;color:var(--amber);font-weight:800;margin-bottom:14px}.back{display:block;text-align:center;color:var(--dim);font-size:12px;text-decoration:none;padding:8px}
    .consent{display:flex;align-items:flex-start;gap:9px;margin:2px 0 13px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#101319}
    .consent input{width:17px;height:17px;flex:0 0 17px;margin:2px 0 0;accent-color:var(--amber);cursor:pointer}
    .consent label{margin:0;color:var(--dim);font-size:11px;line-height:1.55;cursor:pointer}
    .consent a{color:#8bb8df;text-decoration:underline;text-underline-offset:2px}
    .primary:disabled{opacity:.55;cursor:not-allowed}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><div class="logo">🔧</div><span>Karaji</span></div>
      <div class="langs"><button id="enBtn" class="active">EN</button><button id="arBtn">AR</button></div>
    </header>
    <main>
      <a class="back" href="/">← <span data-i18n="back">Back to Karaji</span></a>
      <h1 data-i18n="title">Add Your Garage Free</h1>
      <p data-i18n="intro">Add your garage to the Karaji directory at no cost. Your details will be reviewed before publishing.</p>
      <span class="free" data-i18n="free">100% Free</span>

      <form id="form">
        <label data-i18n="garageName">Garage name</label><input id="garage_name" required />
        <label data-i18n="ownerName">Owner name</label><input id="owner_name" required />
        <label data-i18n="phone">Phone / WhatsApp</label><input id="phone" inputmode="tel" required />
        <label data-i18n="country">Country</label>
        <select id="country"><option value="uae">United Arab Emirates</option><option value="ksa">Saudi Arabia</option><option value="egypt">Egypt</option></select>
        <label data-i18n="address">Address</label><input id="address" required />
        <button type="button" class="btn secondary" id="locationBtn" data-i18n="location">Use my location</button>
        <label data-i18n="photo">Garage photo</label><input id="photo" type="file" accept="image/*" required />

        <div class="consent">
          <input id="fairUsage" type="checkbox" required />
          <label for="fairUsage">
            <span data-i18n="consentPrefix">By submitting, I agree to Karaji's</span>
            <a href="/legal/#fair-usage" target="_blank" rel="noopener" data-i18n="consentLink">Fair Usage &amp; Garage Service Policy</a>.
          </label>
        </div>

        <div id="message"></div>
        <button class="btn primary" id="submitBtn" type="submit" data-i18n="submit">+ Add Your Garage Free</button>
      </form>
    </main>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
    const supabase = createClient("https://fgexzguyjgbwvvqoakly.supabase.co", "sb_publishable_vY9TDYME-PljYp8bJ6cgPQ_2tf5Of_J");
    const $ = (id) => document.getElementById(id);
    const copy = {
      en:{back:"Back to Karaji",title:"Add Your Garage Free",intro:"Add your garage to the Karaji directory at no cost. Your details will be reviewed before publishing.",free:"100% Free",garageName:"Garage name",ownerName:"Owner name",phone:"Phone / WhatsApp",country:"Country",address:"Address",location:"Use my location",photo:"Garage photo",consentPrefix:"By submitting, I agree to Karaji's",consentLink:"Fair Usage & Garage Service Policy",sending:"Submitting...",submit:"+ Add Your Garage Free",success:"Your free garage request was submitted successfully. Karaji will review it before publishing.",error:"Something went wrong. Please try again.",required:"Please complete all required fields and upload a garage photo.",consentRequired:"Please agree to Karaji's Fair Usage & Garage Service Policy before submitting.",locationError:"Could not get your location. Please enter the address manually."},
      ar:{back:"العودة إلى كراجي",title:"أضف جراجك مجانًا",intro:"أضف جراجك إلى دليل كراجي مجانًا بالكامل. سيتم مراجعة البيانات قبل نشرها.",free:"مجاني 100%",garageName:"اسم الجراج",ownerName:"اسم صاحب الجراج",phone:"رقم الهاتف / WhatsApp",country:"الدولة",address:"العنوان",location:"استخدم موقعي",photo:"صورة الجراج",consentPrefix:"بالضغط على إرسال، أوافق على",consentLink:"سياسة الاستخدام العادل وخدمة الجراجات",sending:"جاري الإرسال...",submit:"+ أضف جراجك مجانًا",success:"تم إرسال طلب إضافة جراجك مجانًا بنجاح. سيقوم فريق كراجي بمراجعته قبل النشر.",error:"حدث خطأ. حاول مرة أخرى.",required:"من فضلك أكمل البيانات المطلوبة وارفع صورة للجراج.",consentRequired:"من فضلك وافق على سياسة الاستخدام العادل وخدمة الجراجات قبل الإرسال.",locationError:"تعذر تحديد موقعك. اكتب العنوان يدويًا."}
    };
    let lang="en";
    function setLang(next){lang=next;document.documentElement.lang=next;document.documentElement.dir=next==="ar"?"rtl":"ltr";document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=copy[next][el.dataset.i18n]);$("enBtn").classList.toggle("active",next==="en");$("arBtn").classList.toggle("active",next==="ar");}
    $("enBtn").onclick=()=>setLang("en");$("arBtn").onclick=()=>setLang("ar");
    let coords={lat:null,lng:null,map_link:""};
    $("locationBtn").onclick=()=>{if(!navigator.geolocation){$("message").innerHTML=`<div class="msg error">${copy[lang].locationError}</div>`;return;}$("locationBtn").disabled=true;navigator.geolocation.getCurrentPosition(p=>{coords={lat:p.coords.latitude,lng:p.coords.longitude,map_link:`https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`};$("locationBtn").disabled=false;$("message").innerHTML="";},()=>{$("locationBtn").disabled=false;$("message").innerHTML=`<div class="msg error">${copy[lang].locationError}</div>`;});};
    $("form").onsubmit=async(e)=>{e.preventDefault();const photo=$("photo").files?.[0];if(!$("garage_name").value.trim()||!$("owner_name").value.trim()||!$("phone").value.trim()||!$("address").value.trim()||!photo){$("message").innerHTML=`<div class="msg error">${copy[lang].required}</div>`;return;}if(!$("fairUsage").checked){$("message").innerHTML=`<div class="msg error">${copy[lang].consentRequired}</div>`;$("fairUsage").focus();return;}$("submitBtn").disabled=true;$("submitBtn").textContent=copy[lang].sending;$("message").innerHTML="";try{const ext=(photo.name.split(".").pop()||"jpg").toLowerCase();const path=`free-garage/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;const upload=await supabase.storage.from("garage-photos").upload(path,photo,{upsert:false});if(upload.error)throw upload.error;const photoUrl=supabase.storage.from("garage-photos").getPublicUrl(path).data.publicUrl;const {error}=await supabase.rpc("submit_free_garage_listing",{p_garage_name:$("garage_name").value.trim(),p_owner_name:$("owner_name").value.trim(),p_phone:$("phone").value.trim(),p_address:$("address").value.trim(),p_lat:coords.lat,p_lng:coords.lng,p_map_link:coords.map_link||null,p_photo_url:photoUrl,p_country:$("country").value});if(error)throw error;$("message").innerHTML=`<div class="msg success">${copy[lang].success}</div>`;$("form").reset();coords={lat:null,lng:null,map_link:""};}catch(err){console.error(err);$("message").innerHTML=`<div class="msg error">${copy[lang].error}</div>`;}finally{$("submitBtn").disabled=false;$("submitBtn").textContent=copy[lang].submit;}};
  </script>
</body>
</html>
